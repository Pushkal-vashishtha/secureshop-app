name: app-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep (community + custom rules)
        run: >
          semgrep scan --error
          --config p/default --config p/owasp-top-ten --config .semgrep.yml
          --sarif --output semgrep.sarif services/
      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy (dependencies, secrets, Dockerfiles)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --exit-code 1 services/

  build-scan:
    name: build-scan
    needs: [secrets, sast, sca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/secureshop-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trivy image scan (gate)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" -w /src aquasec/trivy:latest@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 1 \
            "$IMAGE:${{ github.sha }}"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Get pushed digest
        id: digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign image (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ steps.digest.outputs.ref }}"

      - name: Generate SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.digest.outputs.ref }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attest SBOM (signed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.digest.outputs.ref }}"

      - name: Build provenance (SLSA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

  promote:
    name: promote
    needs: [build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Resolve digests and verify signatures
        id: d
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in api web; do
            img="ghcr.io/$OWNER/secureshop-$svc"
            digest=$(docker buildx imagetools inspect "$img:${{ github.sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ -z "$digest" ]; then echo "no digest for $svc"; exit 1; fi
            cosign verify "$img@$digest" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified $img@$digest"
            echo "$svc=$img@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Check out gitops repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/secureshop-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Pin new digests in the dev overlay
        working-directory: gitops/overlays/dev
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          kustomize edit set image "ghcr.io/$OWNER/secureshop-api=${{ steps.d.outputs.api }}"
          kustomize edit set image "ghcr.io/$OWNER/secureshop-web=${{ steps.d.outputs.web }}"
          git config user.name "secureshop-ci"
          git config user.email "secureshop-ci@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -am "promote: secureshop ${{ github.sha }} (signed digests)"
          git push
